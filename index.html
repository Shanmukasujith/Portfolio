<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio</title>
  <meta name="description" content="Personal portfolio: projects, skills, and a way to get in touch.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip" href="#work">Skip to projects</a>

  <header class="site-header">
    <div class="wrap bar">
      <a class="brand" href="#top" data-profile="name">Portfolio</a>
      <nav aria-label="Primary">
        <a href="#work">Projects</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
      </nav>
    </div>
  </header>

  <main id="top">
    <section class="hero wrap" aria-labelledby="hero-name">
      <div class="hero-copy">
        <p class="hero-title" data-profile="title">Loading…</p>
        <h1 id="hero-name" data-profile="name">Portfolio</h1>
        <p class="hero-tagline" data-profile="tagline"></p>
        <div class="actions">
          <a class="btn btn-primary" href="#work">View projects</a>
          <a class="btn btn-ghost" href="#contact">Send a message</a>
        </div>
      </div>

      <figure class="panel" aria-label="Live data from the API">
        <figcaption>Live from the database via /api</figcaption>
        <pre><code id="panel-json">Connecting…</code></pre>
      </figure>
    </section>

    <section id="work" class="section wrap" aria-labelledby="work-h">
      <div class="section-head">
        <h2 id="work-h">Projects</h2>
        <div id="filters" class="filters" role="group" aria-label="Filter projects by technology"></div>
      </div>
      <div id="project-grid" class="grid" aria-live="polite">
        <p class="notice">Loading projects…</p>
      </div>
    </section>

    <section id="about" class="section wrap about" aria-labelledby="about-h">
      <div>
        <h2 id="about-h">About</h2>
        <p class="bio" data-profile="bio"></p>
      </div>
      <div id="skills" class="skills" aria-label="Skills">
        <p class="notice">Loading skills…</p>
      </div>
    </section>

    <section id="contact" class="section wrap contact" aria-labelledby="contact-h">
      <div>
        <h2 id="contact-h">Get in touch</h2>
        <p class="lead">Have a project, a job, or a question? Send a message and I'll reply by email.</p>
        <ul class="contact-links">
          <li><a data-link="email" data-profile="email" href="#" hidden></a></li>
          <li><a data-link="github" href="#" target="_blank" rel="noopener noreferrer" hidden>GitHub</a></li>
          <li><a data-link="linkedin" href="#" target="_blank" rel="noopener noreferrer" hidden>LinkedIn</a></li>
        </ul>
      </div>

      <form id="contact-form" novalidate>
        <div class="field">
          <label for="name">Your name</label>
          <input id="name" name="name" type="text" autocomplete="name" required maxlength="100">
        </div>
        <div class="field">
          <label for="email">Your email</label>
          <input id="email" name="email" type="email" autocomplete="email" required maxlength="254">
        </div>
        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5" required minlength="10" maxlength="2000"></textarea>
        </div>
        <div class="hp" aria-hidden="true">
          <label for="website">Leave this field empty</label>
          <input id="website" name="website" type="text" tabindex="-1" autocomplete="off">
        </div>
        <button class="btn btn-primary" type="submit" id="send-btn">Send message</button>
        <p id="form-status" class="status" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>&copy; <span id="year"></span> <span data-profile="name"></span></p>
    </div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
